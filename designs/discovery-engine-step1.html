<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PartnerScout AI - Configure Discovery</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "apple-bg": "#fbfbfd",
                        "apple-card": "#ffffff",
                        "apple-gray": "#f5f5f7",
                        "apple-border": "rgba(0, 0, 0, 0.06)",
                        "apple-blue": "#0071e3",
                        "apple-blue-hover": "#0077ed",
                        "apple-green": "#34c759",
                        "apple-orange": "#ff9500",
                        "apple-red": "#ff3b30",
                        "apple-text": "#1d1d1f",
                        "apple-text-secondary": "#86868b",
                        "apple-text-tertiary": "#aeaeb2",
                    },
                    fontFamily: {
                        "sf": ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .apple-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04), 0 0 1px rgba(0, 0, 0, 0.1);
        }
        
        .apple-button {
            background: #0071e3;
            color: white;
            border-radius: 980px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .apple-button:hover {
            background: #0077ed;
        }
        
        .apple-input {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            transition: all 0.2s ease;
            color: #1d1d1f;
        }
        
        .apple-input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
            outline: none;
        }
        
        .apple-input::placeholder {
            color: #aeaeb2;
        }
        
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0, 113, 227, 0.08);
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            color: #0071e3;
        }
        
        .tag-remove {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        
        .tag-remove:hover {
            opacity: 1;
        }
        
        .slider-container {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 20px;
        }
        
        .custom-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 2px;
            outline: none;
        }
        
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease;
        }
        
        .custom-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        
        .preset-btn {
            padding: 8px 16px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 980px;
            font-size: 13px;
            font-weight: 500;
            color: #86868b;
            transition: all 0.2s ease;
        }
        
        .preset-btn:hover {
            border-color: #0071e3;
            color: #0071e3;
        }
        
        .preset-btn.active {
            background: rgba(0, 113, 227, 0.08);
            border-color: #0071e3;
            color: #0071e3;
        }
        
        .animate-delay-100 { animation-delay: 0.1s; }
        .animate-delay-200 { animation-delay: 0.2s; }
        .animate-delay-300 { animation-delay: 0.3s; }
    </style>
</head>
<body class="bg-apple-bg text-apple-text min-h-screen">
    <div class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-50 bg-apple-bg/80 backdrop-blur-xl border-b border-apple-border">
            <div class="max-w-3xl mx-auto px-6">
                <div class="flex items-center justify-between h-14">
                    <!-- Logo -->
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-apple-blue to-blue-600 flex items-center justify-center">
                            <svg class="w-4.5 h-4.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                        </div>
                        <span class="font-semibold text-lg tracking-tight">PartnerScout</span>
                    </div>

                    <button class="p-2 rounded-full hover:bg-apple-gray transition-colors">
                        <span class="material-symbols-outlined text-apple-text-secondary">close</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-3xl w-full mx-auto px-6 py-12">
            <!-- Stepper -->
            <div class="mb-16 opacity-0 animate-fade-in">
                <div class="flex items-center justify-center gap-0 max-w-sm mx-auto">
                    <!-- Step 1 - Active -->
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-apple-blue flex items-center justify-center text-white font-semibold text-sm shadow-lg">
                            1
                        </div>
                        <span class="font-medium text-apple-text hidden sm:block">Configure</span>
                    </div>
                    
                    <!-- Connector -->
                    <div class="flex-1 h-px mx-6 bg-gradient-to-r from-apple-blue to-apple-gray max-w-[80px]"></div>
                    
                    <!-- Step 2 - Upcoming -->
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-apple-gray flex items-center justify-center text-apple-text-tertiary font-semibold text-sm">
                            2
                        </div>
                        <span class="font-medium text-apple-text-tertiary hidden sm:block">Launch</span>
                    </div>
                </div>
            </div>

            <!-- Page Header -->
            <div class="text-center mb-12 opacity-0 animate-slide-up animate-delay-100">
                <h1 class="text-4xl font-semibold tracking-tight mb-4">Configure Discovery</h1>
                <p class="text-apple-text-secondary text-xl max-w-lg mx-auto">
                    Define your brand DNA and discovery parameters
                </p>
            </div>

            <!-- Form Card -->
            <div class="apple-card p-8 opacity-0 animate-slide-up animate-delay-200">
                <form class="space-y-8">
                    <!-- Campaign Name -->
                    <div>
                        <label class="block text-sm font-medium text-apple-text mb-2">Campaign Name</label>
                        <input type="text" placeholder="e.g., Summer Wellness Campaign 2026" 
                            class="apple-input w-full px-4 py-3.5"/>
                    </div>

                    <!-- Reference Profiles -->
                    <div>
                        <label class="block text-sm font-medium text-apple-text mb-2">
                            Reference Instagram Profiles
                        </label>
                        <p class="text-apple-text-secondary text-sm mb-3">Add your brand or similar accounts</p>
                        <div class="apple-input p-4">
                            <div class="flex flex-wrap gap-2 mb-3">
                                <span class="tag">
                                    @yourbrand
                                    <span class="tag-remove material-symbols-outlined text-sm">close</span>
                                </span>
                                <span class="tag">
                                    @competitor1
                                    <span class="tag-remove material-symbols-outlined text-sm">close</span>
                                </span>
                            </div>
                            <input type="text" placeholder="Add Instagram handle..." 
                                class="w-full bg-transparent outline-none text-apple-text placeholder:text-apple-text-tertiary"/>
                        </div>
                    </div>

                    <!-- Keywords -->
                    <div>
                        <label class="block text-sm font-medium text-apple-text mb-2">
                            Target Keywords & Hashtags
                        </label>
                        <div class="apple-input p-4">
                            <div class="flex flex-wrap gap-2 mb-3">
                                <span class="tag">
                                    #wellness
                                    <span class="tag-remove material-symbols-outlined text-sm">close</span>
                                </span>
                                <span class="tag">
                                    #healthylifestyle
                                    <span class="tag-remove material-symbols-outlined text-sm">close</span>
                                </span>
                                <span class="tag">
                                    #mindfulness
                                    <span class="tag-remove material-symbols-outlined text-sm">close</span>
                                </span>
                                <span class="tag">
                                    #plantbased
                                    <span class="tag-remove material-symbols-outlined text-sm">close</span>
                                </span>
                            </div>
                            <input type="text" placeholder="Add keyword or hashtag..." 
                                class="w-full bg-transparent outline-none text-apple-text placeholder:text-apple-text-tertiary"/>
                        </div>
                    </div>

                    <!-- Discovery Parameters -->
                    <div class="grid md:grid-cols-2 gap-4">
                        <!-- Profile Count -->
                        <div class="slider-container">
                            <div class="flex items-center justify-between mb-4">
                                <label class="text-sm font-medium text-apple-text">Profiles to Discover</label>
                                <span class="text-lg font-semibold text-apple-blue">50</span>
                            </div>
                            <input type="range" min="10" max="100" value="50" class="custom-slider"/>
                            <div class="flex justify-between text-xs text-apple-text-tertiary mt-2">
                                <span>10</span>
                                <span>100</span>
                            </div>
                        </div>

                        <!-- Minimum Score -->
                        <div class="slider-container">
                            <div class="flex items-center justify-between mb-4">
                                <label class="text-sm font-medium text-apple-text">Minimum Score</label>
                                <span class="text-lg font-semibold text-apple-green">70%</span>
                            </div>
                            <input type="range" min="50" max="95" value="70" class="custom-slider"/>
                            <div class="flex justify-between text-xs text-apple-text-tertiary mt-2">
                                <span>50%</span>
                                <span>95%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Follower Range -->
                    <div class="slider-container">
                        <label class="block text-sm font-medium text-apple-text mb-4">Follower Range</label>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs text-apple-text-secondary mb-2">Minimum</label>
                                <input type="text" value="10,000" class="apple-input w-full px-4 py-3"/>
                            </div>
                            <div>
                                <label class="block text-xs text-apple-text-secondary mb-2">Maximum</label>
                                <input type="text" value="500,000" class="apple-input w-full px-4 py-3"/>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" class="preset-btn">Nano (1K-10K)</button>
                            <button type="button" class="preset-btn active">Micro (10K-100K)</button>
                            <button type="button" class="preset-btn">Mid-tier (100K-500K)</button>
                            <button type="button" class="preset-btn">Macro (500K+)</button>
                        </div>
                    </div>

                    <!-- Advanced Options -->
                    <div class="border-t border-apple-border pt-6">
                        <button type="button" class="flex items-center gap-2 text-apple-text-secondary hover:text-apple-blue transition-colors">
                            <span class="material-symbols-outlined text-lg">tune</span>
                            <span class="text-sm font-medium">Advanced Options</span>
                            <span class="material-symbols-outlined text-lg">expand_more</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between mt-10 opacity-0 animate-fade-in animate-delay-300">
                <button class="flex items-center gap-2 text-apple-text-secondary hover:text-apple-text transition-colors">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    <span class="text-sm font-medium">Cancel</span>
                </button>
                <button class="apple-button inline-flex items-center gap-2 px-8 py-3.5 text-sm">
                    Continue
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-8 mt-auto border-t border-apple-border">
            <div class="max-w-3xl mx-auto px-6">
                <p class="text-center text-apple-text-tertiary text-sm">
                    © 2026 PartnerScout AI
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
