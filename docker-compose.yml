# =============================================================================
# PartnerScout AI — Docker Compose
#
# Services:
#   backend   — FastAPI + Uvicorn (Python 3.13)
#   frontend  — React SPA built by Vite, served by Nginx
#   nginx     — Reverse proxy routing /api to backend, / to frontend
#
# Usage:
#   docker compose up --build -d          # Build and start all services
#   docker compose down                   # Stop and remove containers
#   docker compose logs -f backend        # Tail backend logs
#
# Environment:
#   Backend .env is generated by GitHub Actions from GitHub Secrets.
#   Frontend VITE_* vars are passed as build args (baked into the JS bundle).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend                  # Build from backend/Dockerfile
    container_name: partnerscout-backend
    # Load environment variables from the .env file on the VPS
    # This file is generated by the GitHub Actions deploy step
    env_file:
      - ./backend/.env
    # Override the ENVIRONMENT var to "production" regardless of .env
    environment:
      - ENVIRONMENT=production
    # Only expose port 8000 inside the Docker network (not to the host)
    # The nginx service proxies external traffic to this port
    expose:
      - "8000"
    networks:
      - app-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — React SPA (built and served by Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend                 # Build from frontend/Dockerfile
      # These ARGs are injected at build time so Vite can inline them
      # into the JavaScript bundle (import.meta.env.VITE_*)
      # Values come from the shell environment, set by GitHub Actions
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: partnerscout-frontend
    # Only expose port 80 inside the Docker network
    expose:
      - "80"
    networks:
      - app-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy (the only service exposed to the internet)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine              # Use the same version as frontend stage 2
    container_name: partnerscout-nginx
    # Map host port 80 to container port 80 — this is the public entry point
    ports:
      - "80:80"
    # Mount the reverse proxy config into the container
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Wait for backend and frontend to start before launching nginx
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

# =============================================================================
# Shared network — all services communicate over this internal bridge
# =============================================================================
networks:
  app-network:
    driver: bridge
