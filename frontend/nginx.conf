# =============================================================================
# PartnerScout AI — Frontend Nginx Config (inside frontend container)
#
# This config serves the React SPA from /usr/share/nginx/html.
# All routes that don't match a static file fall back to index.html
# so React Router can handle client-side routing.
# =============================================================================

server {
    # Listen on port 80 inside the container
    # The outer reverse-proxy Nginx routes traffic here
    listen 80;
    server_name _;

    # Root directory where Vite's build output (dist/) is copied
    root /usr/share/nginx/html;
    index index.html;

    # -- SPA fallback routing --------------------------------------------------
    # 1. Try the exact URI ($uri)
    # 2. Try it as a directory ($uri/)
    # 3. Fall back to index.html so React Router handles the route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- Cache static assets aggressively --------------------------------------
    # Vite produces hashed filenames (e.g. index-abc123.js) so it's safe to
    # cache them for a long time; the hash changes on every rebuild
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -- Security headers -------------------------------------------------------
    # Prevent the browser from MIME-sniffing the content type
    add_header X-Content-Type-Options "nosniff" always;
    # Block rendering inside iframes to prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # -- Disable access log for favicon/robots (reduces noise) ------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
