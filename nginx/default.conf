# =============================================================================
# PartnerScout AI — Nginx Reverse Proxy Config
#
# This runs in the top-level "nginx" container and routes traffic:
#   /api/*           → backend container (FastAPI on port 8000)
#   /docs, /redoc    → backend container (Swagger UI)
#   /openapi.json    → backend container (OpenAPI spec)
#   everything else  → frontend container (React SPA on port 80)
#
# Docker Compose service names ("backend", "frontend") resolve via
# Docker's internal DNS, so no IP addresses are needed.
# =============================================================================

# -- Upstream definitions -------------------------------------------------------
# Named upstreams make it easy to change ports or add load balancing later

upstream backend_upstream {
    # "backend" is the Docker Compose service name; port 8000 is what Uvicorn listens on
    server backend:8000;
}

upstream frontend_upstream {
    # "frontend" is the Docker Compose service name; port 80 is what Nginx inside the frontend container listens on
    server frontend:80;
}

server {
    # Listen on port 80 — this is the only port exposed to the host
    listen 80;
    server_name _;

    # -- Proxy timeouts ---------------------------------------------------------
    # Increase timeouts for long-running AI agent requests (scoring, discovery)
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # -- Common proxy headers ---------------------------------------------------
    # These headers let the backend know the real client IP and protocol

    # -- Backend API routes -----------------------------------------------------
    # All /api/* requests are forwarded to the FastAPI backend
    location /api/ {
        proxy_pass http://backend_upstream;

        # Pass the real client IP to FastAPI (shows in logs, rate limiting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- Swagger / ReDoc documentation ------------------------------------------
    # Forward API docs routes to the backend so devs can access them in the browser
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -- OpenAPI JSON spec -------------------------------------------------------
    # Swagger UI fetches this to render the docs
    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -- Frontend (React SPA) ---------------------------------------------------
    # Everything else goes to the frontend container
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -- Error pages (optional) -------------------------------------------------
    # Return a simple JSON error if both upstreams are down
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
